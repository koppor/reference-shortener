version: 2

# Only the GitHub Actions used by the workflows are tracked. The jbang script //DEPS
# (jablib, picocli, icu4j, e-adr) cannot be managed here: Dependabot has no ecosystem for
# jbang script headers, and jablib is a moving 6.0-SNAPSHOT that already resolves to the latest.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Bundle all action bumps into a single PR to keep the noise down.
      actions:
        patterns:
          - "*"
