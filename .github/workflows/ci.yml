name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changelog:
    name: Lint CHANGELOG (heylogs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jbangdev/setup-jbang@main
      - run: jbang trust add https://github.com/nbbrd/jbang-catalog/
      - run: jbang heylogs@nbbrd check -v semver CHANGELOG.md

  smoke:
    name: Smoke test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jbangdev/setup-jbang@main
      - name: Install a minimal TeX distribution
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base
      - run: ./smoke-test.sh

  native:
    name: Native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
      - uses: jbangdev/setup-jbang@main
      - run: jbang --native ReferenceShortener.java --version
