name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changelog:
    name: Lint CHANGELOG (heylogs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jbangdev/jbang-action@v0.142.0
        with:
          trust: https://github.com/nbbrd/jbang-catalog/
          script: heylogs@nbbrd
          scriptargs: check -v semver CHANGELOG.md

  smoke:
    name: Smoke test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jbangdev/setup-jbang@main
      - name: Install a minimal TeX distribution
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base
      - run: ./smoke-test.sh

  # The native image is built (and validated) by the dedicated "Binaries" workflow across all
  # platforms, so there is no separate native job here.
